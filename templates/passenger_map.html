<!DOCTYPE html>
<html lang="si">
<head>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>මගියාගේ පිටුව - Passenger Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; text-align: center; background: #f4f6f9; }
        header { background: #28a745; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        #map { height: 68vh; width: 100%; }
        .status { padding: 12px; background: #e2e3e5; font-weight: bold; color: #383d41; font-size: 14px; }
        .panel { background: #ffffff; padding: 12px; display: flex; justify-content: center; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #ddd; }
        a.logout { color: white; background: #dc3545; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn-attendance-yes { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-attendance-no { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h3 style="margin:0; font-size: 16px;">{{ username }} (මගී - වාහනය: {{ vehicle_code }})</h3>
        <a href="/logout" class="logout" onclick="notifyLogout()">ඉවත් වන්න</a>
    </header>

    <div class="panel">
        <span style="font-weight: bold; font-size: 14px;">අද ගමනට එකතු වෙනවාද?:</span>
        <button class="btn-attendance-yes" onclick="sendAttendance('Present')">🟢 ඔව් (Present)</button>
        <button class="btn-attendance-no" onclick="sendAttendance('Absent')">🔴 නැහැ (Absent)</button>
    </div>

    <div class="status" id="status">ඔබේ ජීපීඑස් ලොකේෂන් එක ලබා ගනිමින් පවතී...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
    
    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        let map = L.map('map').setView([7.8731, 80.7718], 13);
        let passengerMarker = null;
        let myVehicleCode = "{{ vehicle_code }}".trim();
        let myUsername = "{{ username }}";

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        const greenIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41]
        });

        function notifyLogout() {
            socket.emit('user_logout', { username: myUsername, role: 'passenger', vehicle_code: myVehicleCode });
        }

        function sendAttendance(status) {
            socket.emit('update_attendance', { username: myUsername, vehicle_code: myVehicleCode, status: status });
            alert(status === 'Present' ? "ඔබ ගමනට එකතු වන බව (Present) රියදුරුට දැන්වීය!" : "ඔබ අද පැමිණෙන්නේ නැති බව (Absent) රියදුරුට දැන්වීය!");
        }

        socket.on('connect', () => {
            socket.emit('join', { vehicle_code: myVehicleCode, username: myUsername, role: 'passenger' });
        });

        // GPS ලොකේෂන් ලබාගෙන රියදුරු වෙත යැවීම
        function startGPSTracking() {
            if (!("geolocation" in navigator)) {
                document.getElementById('status').innerText = "ඔබගේ බ්‍රව්සරය GPS සඳහා සහාය නොදක්වයි.";
                return;
            }

            navigator.geolocation.watchPosition(
                (position) => {
                    let lat = position.coords.latitude;
                    let lng = position.coords.longitude;

                    if (!passengerMarker) {
                        passengerMarker = L.marker([lat, lng], { icon: greenIcon }).addTo(map).bindPopup("ඔබ (මගියා)").openPopup();
                        map.setView([lat, lng], 15);
                    } else {
                        passengerMarker.setLatLng([lat, lng]);
                    }

                    document.getElementById('status').innerText = "ජීපීඑස් ලොකේෂන් යැවෙමින් පවතී (" + lat.toFixed(4) + ", " + lng.toFixed(4) + ")";

                    socket.emit('update_location', {
                        role: 'passenger',
                        lat: lat,
                        lng: lng,
                        vehicle_code: myVehicleCode,
                        username: myUsername
                    });
                },
                (error) => {
                    document.getElementById('status').innerText = "GPS දෝෂයකි! කරුණාකර Location (GPS) සක්‍රීය කරන්න.";
                },
                { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
            );
        }

        startGPSTracking();
    </script>
</body>
</html>
