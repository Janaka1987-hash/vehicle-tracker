<!DOCTYPE html>
<html lang="si">
<head>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>මගියාගේ පිටුව - Passenger Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; text-align: center; background: #f4f6f9; }
        header { background: #28a745; color: white; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
        #map { height: 68vh; min-height: 360px; width: 100%; transition: height 0.25s ease; }
        #map.expanded { height: 84vh; }
        .status { padding: 8px 10px; background: #e2e3e5; font-weight: bold; color: #383d41; font-size: 13px; }
        .panel { background: #ffffff; padding: 7px 10px; display: flex; justify-content: center; gap: 6px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #ddd; font-size: 12px; }
        .custom-km-box { background: #f8f9fa; padding: 7px 10px; display: flex; justify-content: center; gap: 6px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #ddd; font-size: 12px; }
        .home-alarm-box { background: #eef6ff; padding: 7px 10px; display: flex; justify-content: center; gap: 6px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #cfe2ff; font-size: 12px; }
        .custom-km-box input { width: 70px; padding: 5px 6px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; font-weight: bold; text-align: center; }
        .btn-set-km { background: #0d6efd; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-reset-km { background: #6c757d; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-save-home { background: #fd7e14; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-toggle-home { background: #198754; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-clear-home { background: #dc3545; color: white; border: none; padding: 6px 8px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .info-bar { background: #ffffff; padding: 6px 10px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; font-size: 12px; font-weight: bold; color: #222; border-bottom: 1px solid #e5e5e5; }
        a.logout { color: white; background: #dc3545; padding: 5px 10px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 13px; }
        .btn-attendance-yes { background: #28a745; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 12px; }
        .btn-attendance-no { background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 12px; }
        .btn-attendance-yes.selected, .btn-attendance-no.selected { outline: 3px solid #ffc107; transform: scale(1.03); }
        .btn-sound { background: #0d6efd; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-notif { background: #6f42c1; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-fit { background: #17a2b8; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-expand { background: #343a40; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .controls-hidden { display: none !important; }
        .alarm-banner {
            display: none;
            background: #ff9800;
            color: #111;
            padding: 12px 15px;
            font-weight: bold;
            font-size: 15px;
            border-bottom: 2px solid #e65100;
            animation: pulseBg 0.8s infinite alternate;
        }
        .alarm-banner.active {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-stop-alarm {
            background: #212529;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        @keyframes pulseBg {
            from { background: #ffb74d; }
            to { background: #ff5722; color: #fff; }
        }
    </style>
</head>
<body>
    <header>
        <h3 style="margin:0; font-size: 15px;">{{ username }} (මගී - වාහනය: {{ vehicle_code }})</h3>
        <a href="/logout" class="logout" onclick="notifyLogout()">ඉවත් වන්න</a>
    </header>

    <div class="panel" id="topPanel">
        <span style="font-weight: bold;">අද ගමන:</span>
        <button id="btnYes" class="btn-attendance-yes" onclick="sendAttendance('Present')">🟢 Present</button>
        <button id="btnNo" class="btn-attendance-no" onclick="sendAttendance('Absent')">🔴 Absent</button>
        <button class="btn-sound" id="soundBtn" onclick="enableAudioAlarm()">🔔 Sound ON</button>
        <button class="btn-notif" id="notifBtn" onclick="requestNotificationPermission()">📩 Alert</button>
        <button class="btn-fit" onclick="fitBothMarkers()">📍 සකසන්න</button>
        <button class="btn-expand" id="expandMapBtn" onclick="toggleMapExpand()">⛶ මැප් ලොකු කරන්න</button>
    </div>

    <div class="custom-km-box" id="kmBox">
        <label for="customKmInput"><strong>📏 KM එලාම්:</strong></label>
        <input type="number" id="customKmInput" step="0.1" min="0.1" placeholder="උදා: 4">
        <button class="btn-set-km" onclick="setCustomKmAlarm()">Set KM</button>
        <button class="btn-reset-km" onclick="resetToDefaultAlarm()">Clear KM</button>
        <span id="alarmRuleLabel" style="color: #0d6efd; font-weight: bold;">Always Active: 500m–300m</span>
    </div>

    <div class="home-alarm-box" id="homeBox">
        <span><strong>😴 බහින තැන (500m–300m):</strong></span>
        <button class="btn-save-home" onclick="saveCurrentAsHome()">🏠 Save</button>
        <button class="btn-toggle-home" id="homeToggleBtn" onclick="toggleHomeAlarm()">Wake-Up: OFF</button>
        <button class="btn-clear-home" id="homeClearBtn" onclick="clearHomeLocation()" style="display:none;">✖</button>
        <span id="homeStatusLabel" style="color: #555; font-weight: bold;">බහින තැන සේව් කර නැත</span>
    </div>

    <div class="info-bar">
        <span id="distanceInfo">📏 වාහනයට: --</span>
        <span id="etaInfo">⏱️ වේලාව: --</span>
        <span id="homeDistInfo">🏠 ගෙදරට: --</span>
        <span id="myAttendanceInfo">📝 තත්ත්වය: නැත</span>
    </div>

    <div class="alarm-banner" id="alarmBanner">
        <span id="alarmText">🚨 අවධානයයි!</span>
        <button class="btn-stop-alarm" onclick="stopAlarm()">🔕 Stop Alarm</button>
    </div>

    <div class="status" id="status">ඔබේ ජීපීඑස් ලොකේෂන් එක ලබා ගනිමින් පවතී...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
    
    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        let map = L.map('map').setView([7.8731, 80.7718], 13);
        let passengerMarker = null;
        let driverMarker = null;
        let homeMarker = null;
        let myVehicleCode = "{{ vehicle_code }}".trim();
        let myUsername = "{{ username }}";

        let latestPassengerCoords = null;
        let latestDriverCoords = null;

        const MAX_ALARM_DISTANCE = 500;
        const MIN_ALARM_DISTANCE = 300;
        let customAlarmMeters = null;

        let autoBandAlarmTriggered = false;
        let customKmAlarmTriggered = false;

        let savedHomeCoords = null;
        let homeAlarmEnabled = false;
        let homeAlarmArmed = false;
        let homeAlarmTriggered = false;

        let alarmInterval = null;
        let audioCtx = null;
        let isMapExpanded = false;

        const STORAGE_ATT_KEY = `ridesync_att_${myVehicleCode}_${myUsername}`;
        const STORAGE_KM_KEY = `ridesync_custom_km_${myVehicleCode}_${myUsername}`;
        const STORAGE_HOME_KEY = `ridesync_home_${myVehicleCode}_${myUsername}`;
        const STORAGE_HOME_ENABLED_KEY = `ridesync_home_enabled_${myVehicleCode}_${myUsername}`;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        const greenIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41]
        });

        const redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41]
        });

        const homeIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-gold.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41]
        });

        function toggleMapExpand() {
            isMapExpanded = !isMapExpanded;
            const mapEl = document.getElementById('map');
            const kmBox = document.getElementById('kmBox');
            const homeBox = document.getElementById('homeBox');
            const btn = document.getElementById('expandMapBtn');

            if (isMapExpanded) {
                mapEl.classList.add('expanded');
                kmBox.classList.add('controls-hidden');
                homeBox.classList.add('controls-hidden');
                btn.innerText = '🗗 සාමාන්‍ය කරන්න';
            } else {
                mapEl.classList.remove('expanded');
                kmBox.classList.remove('controls-hidden');
                homeBox.classList.remove('controls-hidden');
                btn.innerText = '⛶ මැප් ලොකු කරන්න';
            }

            setTimeout(() => {
                map.invalidateSize();
            }, 300);
        }

        function applyAttendanceUI(status) {
            const btnYes = document.getElementById('btnYes');
            const btnNo = document.getElementById('btnNo');
            const info = document.getElementById('myAttendanceInfo');
            btnYes.classList.remove('selected');
            btnNo.classList.remove('selected');

            if (status === 'Present') {
                btnYes.classList.add('selected');
                info.innerText = "📝 තත්ත්වය: 🟢 Present";
            } else if (status === 'Absent') {
                btnNo.classList.add('selected');
                info.innerText = "📝 තත්ත්වය: 🔴 Absent";
            } else {
                info.innerText = "📝 තත්ත්වය: නැත";
            }
        }

        function updateAlarmRuleLabel() {
            const label = document.getElementById('alarmRuleLabel');
            if (customAlarmMeters && customAlarmMeters > 0) {
                const kmVal = (customAlarmMeters / 1000).toFixed(customAlarmMeters % 1000 === 0 ? 0 : 2);
                label.innerText = `Active: 500m–300m + ${kmVal} km`;
                label.style.color = "#198754";
            } else {
                label.innerText = "Always Active: 500m–300m";
                label.style.color = "#0d6efd";
            }
        }

        function setCustomKmAlarm() {
            const input = document.getElementById('customKmInput');
            const km = parseFloat(input.value);
            if (isNaN(km) || km <= 0) {
                alert("කරුණාකර 0 ට වැඩි කිලෝමීටර් (km) අගයක් ඇතුළත් කරන්න (උදා: 4).");
                return;
            }
            customAlarmMeters = km * 1000;
            customKmAlarmTriggered = false;
            localStorage.setItem(STORAGE_KM_KEY, String(km));
            updateAlarmRuleLabel();
            unlockAudio();
            checkProximity();
            alert(`අමතර එලාම් දුර ${km} km ලෙස සකසන ලදී! (500m–300m එලාම් එකත් දිගටම ක්‍රියා කරයි)`);
        }

        function resetToDefaultAlarm() {
            customAlarmMeters = null;
            customKmAlarmTriggered = false;
            document.getElementById('customKmInput').value = "";
            localStorage.removeItem(STORAGE_KM_KEY);
            updateAlarmRuleLabel();
            checkProximity();
            alert("අමතර KM ඉවත් කළා. 500m–300m එලාම් එක දිගටම ක්‍රියාත්මකයි.");
        }

        function renderHomeMarker() {
            if (savedHomeCoords) {
                if (!homeMarker) {
                    homeMarker = L.marker([savedHomeCoords.lat, savedHomeCoords.lng], { icon: homeIcon })
                        .addTo(map)
                        .bindPopup("🏠 ඔබ බහින ස්ථානය (ගේ ගාව)");
                } else {
                    homeMarker.setLatLng([savedHomeCoords.lat, savedHomeCoords.lng]);
                }
            } else if (homeMarker) {
                map.removeLayer(homeMarker);
                homeMarker = null;
            }
        }

        function updateHomeAlarmUI() {
            const toggleBtn = document.getElementById('homeToggleBtn');
            const clearBtn = document.getElementById('homeClearBtn');
            const statusLabel = document.getElementById('homeStatusLabel');

            if (!savedHomeCoords) {
                toggleBtn.innerText = "Wake-Up: OFF";
                toggleBtn.style.background = "#6c757d";
                clearBtn.style.display = "none";
                statusLabel.innerText = "බහින තැන සේව් කර නැත";
                statusLabel.style.color = "#555";
                document.getElementById('homeDistInfo').innerText = "🏠 ගෙදරට: --";
                return;
            }

            clearBtn.style.display = "inline-block";

            if (homeAlarmEnabled) {
                toggleBtn.innerText = "🔔 Wake-Up: ON";
                toggleBtn.style.background = "#198754";
                if (homeAlarmArmed) {
                    statusLabel.innerText = "✅ සූදානම් (500m–300m)";
                    statusLabel.style.color = "#198754";
                } else {
                    statusLabel.innerText = "⏳ 1km ඈතට ගිය පසු Arm වේ";
                    statusLabel.style.color = "#fd7e14";
                }
            } else {
                toggleBtn.innerText = "🔕 Wake-Up: OFF";
                toggleBtn.style.background = "#6c757d";
                statusLabel.innerText = "සේව් කර ඇත (OFF)";
                statusLabel.style.color = "#555";
            }
        }

        function saveCurrentAsHome() {
            if (!latestPassengerCoords) {
                alert("තවම ඔබේ GPS ලොකේෂන් එක ලැබී නැත. මොහොතක් රැඳී සිට නැවත උත්සාහ කරන්න.");
                return;
            }
            savedHomeCoords = {
                lat: latestPassengerCoords.lat,
                lng: latestPassengerCoords.lng
            };
            homeAlarmEnabled = true;
            homeAlarmArmed = false;
            homeAlarmTriggered = false;

            localStorage.setItem(STORAGE_HOME_KEY, JSON.stringify(savedHomeCoords));
            localStorage.setItem(STORAGE_HOME_ENABLED_KEY, "true");

            unlockAudio();
            renderHomeMarker();
            updateHomeAlarmUI();
            checkHomeProximity();
            alert("🏠 ඔබ බහින ස්ථානය (ගේ ගාව) සාර්ථකව සේව් කළා! 1km ඈතට ගිය පසු, හවස ආපහු ගේ ගාවට 500m–300m ළං වෙද්දී Wake-Up Alarm එක වදිනවා.");
        }

        function toggleHomeAlarm() {
            if (!savedHomeCoords) {
                alert("පළමුව ගේ ගාව ඉඳන් '🏠 Save' ඔබා බහින ස්ථානය සේව් කරන්න.");
                return;
            }
            homeAlarmEnabled = !homeAlarmEnabled;
            homeAlarmTriggered = false;

            if (homeAlarmEnabled && latestPassengerCoords) {
                const distFromHome = calculateDistanceMeters(
                    latestPassengerCoords.lat,
                    latestPassengerCoords.lng,
                    savedHomeCoords.lat,
                    savedHomeCoords.lng
                );
                if (distFromHome > MAX_ALARM_DISTANCE) {
                    homeAlarmArmed = true;
                }
            }

            localStorage.setItem(STORAGE_HOME_ENABLED_KEY, homeAlarmEnabled ? "true" : "false");
            unlockAudio();
            updateHomeAlarmUI();
            checkHomeProximity();
        }

        function clearHomeLocation() {
            savedHomeCoords = null;
            homeAlarmEnabled = false;
            homeAlarmArmed = false;
            homeAlarmTriggered = false;
            localStorage.removeItem(STORAGE_HOME_KEY);
            localStorage.removeItem(STORAGE_HOME_ENABLED_KEY);
            renderHomeMarker();
            updateHomeAlarmUI();
        }

        function checkHomeProximity() {
            if (!savedHomeCoords || !latestPassengerCoords) return;

            const distToHome = calculateDistanceMeters(
                latestPassengerCoords.lat,
                latestPassengerCoords.lng,
                savedHomeCoords.lat,
                savedHomeCoords.lng
            );

            const roundedHomeDist = Math.round(distToHome);
            const homeDistStr = roundedHomeDist >= 1000 ? `${(roundedHomeDist / 1000).toFixed(2)} km` : `${roundedHomeDist} m`;
            document.getElementById('homeDistInfo').innerText = `🏠 ගෙදරට: ${homeDistStr}`;

            if (!homeAlarmEnabled) return;

            if (distToHome > 1000 && !homeAlarmArmed) {
                homeAlarmArmed = true;
                homeAlarmTriggered = false;
                updateHomeAlarmUI();
            }

            if (homeAlarmArmed && distToHome <= MAX_ALARM_DISTANCE) {
                if (!homeAlarmTriggered) {
                    homeAlarmTriggered = true;
                    triggerGenericAlarm(
                        `🏠 ඇහැරෙන්න! ඔබ බහින ස්ථානයට (ගේ ගාවට) ${homeDistStr} ක් ළඟයි!`,
                        "🏠 බහින තැන ළඟයි!"
                    );
                }
            }
        }

        const savedAtt = localStorage.getItem(STORAGE_ATT_KEY);
        if (savedAtt) applyAttendanceUI(savedAtt);

        const savedKm = parseFloat(localStorage.getItem(STORAGE_KM_KEY));
        if (!isNaN(savedKm) && savedKm > 0) {
            customAlarmMeters = savedKm * 1000;
            document.getElementById('customKmInput').value = savedKm;
        }
        updateAlarmRuleLabel();

        try {
            const rawHome = localStorage.getItem(STORAGE_HOME_KEY);
            if (rawHome) {
                const parsedHome = JSON.parse(rawHome);
                if (parsedHome && typeof parsedHome.lat === 'number' && typeof parsedHome.lng === 'number') {
                    savedHomeCoords = parsedHome;
                    homeAlarmEnabled = localStorage.getItem(STORAGE_HOME_ENABLED_KEY) === "true";
                    renderHomeMarker();
                }
            }
        } catch (e) {}
        updateHomeAlarmUI();

        function fitBothMarkers() {
            const points = [];
            if (passengerMarker) points.push(passengerMarker.getLatLng());
            if (driverMarker) points.push(driverMarker.getLatLng());
            if (homeMarker) points.push(homeMarker.getLatLng());

            if (points.length >= 2) {
                map.fitBounds(L.latLngBounds(points), { padding: [40, 40] });
            } else if (points.length === 1) {
                map.setView(points[0], 15);
            }
        }

        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("මෙම බ්‍රව්සරය Notifications සඳහා සහාය නොදක්වයි.");
                return;
            }
            Notification.requestPermission().then((permission) => {
                updateNotifButton(permission);
                if (permission === "granted") {
                    new Notification("RideSync Alarm Ready", {
                        body: "රියදුරු ළං වූ විට හෝ බහින ස්ථානයට ළං වූ විට alert ලැබෙනු ඇත.",
                        icon: "{{ url_for('static', filename='icon.png') }}"
                    });
                }
            });
        }

        function updateNotifButton(perm) {
            const btn = document.getElementById('notifBtn');
            if (!btn) return;
            if (perm === "granted") {
                btn.innerText = "📩 Alert ON";
                btn.style.background = "#198754";
            }
        }

        if ("Notification" in window && Notification.permission === "granted") {
            updateNotifButton("granted");
        }

        function sendSystemNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    new Notification(title, {
                        body: body,
                        icon: "{{ url_for('static', filename='icon.png') }}",
                        vibrate: [500, 200, 500, 200, 500],
                        tag: "ridesync-proximity",
                        renotify: true
                    });
                } catch (e) {}
            }
        }

        function unlockAudio() {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx && AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const btn = document.getElementById('soundBtn');
                if (btn) {
                    btn.innerText = "🔔 Sound Ready";
                    btn.style.background = "#198754";
                }
            } catch (e) {}
        }

        function enableAudioAlarm() {
            unlockAudio();
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission().then(updateNotifButton);
            }
            playAlarmPattern();
        }

        document.addEventListener('click', unlockAudio, { once: true });
        document.addEventListener('touchstart', unlockAudio, { once: true });

        function playAlarmPattern() {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx && AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                const tones = [0, 0.25, 0.5];
                tones.forEach((offset) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(950, now + offset);
                    gain.gain.setValueAtTime(0.4, now + offset);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.2);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + offset);
                    osc.stop(now + offset + 0.22);
                });
            } catch (e) {}
        }

        function triggerGenericAlarm(msg, notifTitle) {
            const banner = document.getElementById('alarmBanner');
            const alarmText = document.getElementById('alarmText');

            alarmText.innerText = msg;
            banner.classList.add('active');
            document.title = msg;

            sendSystemNotification(notifTitle, msg);

            if ("vibrate" in navigator) {
                try {
                    navigator.vibrate([700, 200, 700, 200, 700]);
                } catch (e) {}
            }

            playAlarmPattern();
            if (!alarmInterval) {
                alarmInterval = setInterval(() => {
                    playAlarmPattern();
                    if ("vibrate" in navigator) {
                        try { navigator.vibrate([600, 200, 600]); } catch (e) {}
                    }
                }, 2000);
            }
        }

        function triggerProximityAlarm(distanceMeters, reasonLabel) {
            const roundedDist = Math.round(distanceMeters);
            const distFormatted = roundedDist >= 1000 ? `${(roundedDist / 1000).toFixed(2)} km` : `${roundedDist} m`;
            const msg = `🚨 රියදුරු ${distFormatted} දුරින් සිටී (${reasonLabel})!`;
            triggerGenericAlarm(msg, "🚨 වාහනය ළඟ එනවා!");
        }

        function clearAlarmUIOnly() {
            const banner = document.getElementById('alarmBanner');
            banner.classList.remove('active');
            document.title = "මගියාගේ පිටුව - Passenger Dashboard";
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        function stopAlarm() {
            clearAlarmUIOnly();
            if (myUsername && myVehicleCode) {
                socket.emit('passenger_alarm_stopped', {
                    username: myUsername,
                    vehicle_code: myVehicleCode
                });
            }
        }

        function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const toRad = (deg) => deg * (Math.PI / 180);
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function updateDistanceAndETA(distMeters) {
            const distStr = distMeters >= 1000 ? `${(distMeters / 1000).toFixed(2)} km` : `${Math.round(distMeters)} m`;
            document.getElementById('distanceInfo').innerText = `📏 වාහනයට: ${distStr}`;

            const estSeconds = distMeters / 6.94;
            const estMinutes = Math.max(1, Math.round(estSeconds / 60));
            const etaStr = distMeters < 100 ? "දැන්ම පාහේ" : `විනාඩි ${estMinutes}`;
            document.getElementById('etaInfo').innerText = `⏱️ වේලාව: ${etaStr}`;
        }

        function checkProximity() {
            if (!latestPassengerCoords || !latestDriverCoords) return;

            const dist = calculateDistanceMeters(
                latestPassengerCoords.lat,
                latestPassengerCoords.lng,
                latestDriverCoords.lat,
                latestDriverCoords.lng
            );
            updateDistanceAndETA(dist);

            const roundedDist = Math.round(dist);
            const distText = roundedDist >= 1000 ? `${(roundedDist / 1000).toFixed(2)} km` : `${roundedDist} m`;

            let shouldTriggerNow = false;
            let triggerReason = "";

            const inAutoBand = (dist <= MAX_ALARM_DISTANCE && dist >= MIN_ALARM_DISTANCE);
            if (inAutoBand) {
                if (!autoBandAlarmTriggered) {
                    autoBandAlarmTriggered = true;
                    shouldTriggerNow = true;
                    triggerReason = "500m–300m කලාපය";
                }
            } else if (dist > MAX_ALARM_DISTANCE) {
                autoBandAlarmTriggered = false;
            }

            if (customAlarmMeters && customAlarmMeters > 0) {
                const targetKm = (customAlarmMeters / 1000).toFixed(customAlarmMeters % 1000 === 0 ? 0 : 2);
                if (dist <= customAlarmMeters && !inAutoBand) {
                    if (!customKmAlarmTriggered) {
                        customKmAlarmTriggered = true;
                        shouldTriggerNow = true;
                        triggerReason = `${targetKm} km සීමාව`;
                    }
                } else if (dist > customAlarmMeters) {
                    customKmAlarmTriggered = false;
                }
            }

            if (shouldTriggerNow) {
                triggerProximityAlarm(dist, triggerReason);
            }

            if (inAutoBand) {
                document.getElementById('status').innerText =
                    `🚨 රියදුරු ${distText} දුරින් සිටී (500m–300m Alarm ක්‍රියාත්මකයි!)`;
            } else if (dist < MIN_ALARM_DISTANCE) {
                document.getElementById('status').innerText =
                    `📍 රියදුරු ඉතා ළඟයි! දුර: ${distText} (300m ට අඩුයි)`;
            } else if (customAlarmMeters && customAlarmMeters > 0) {
                const targetKm = (customAlarmMeters / 1000).toFixed(customAlarmMeters % 1000 === 0 ? 0 : 2);
                document.getElementById('status').innerText =
                    `රියදුරු සජීවීව සිටී | දුර: ${distText} | Alarms: ${targetKm} km & 500m–300m`;
            } else {
                document.getElementById('status').innerText =
                    `රියදුරු සජීවීව සිටී | දුර: ${distText}`;
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                unlockAudio();
                checkProximity();
                checkHomeProximity();
            }
        });

        function notifyLogout() {
            clearAlarmUIOnly();
            socket.emit('user_logout', { username: myUsername, role: 'passenger', vehicle_code: myVehicleCode });
        }

        function sendAttendance(status) {
            localStorage.setItem(STORAGE_ATT_KEY, status);
            applyAttendanceUI(status);
            socket.emit('update_attendance', { username: myUsername, vehicle_code: myVehicleCode, status: status });
            alert(status === 'Present' ? "ඔබ ගමනට එකතු වන බව (Present) රියදුරුට දැන්වීය!" : "ඔබ අද පැමිණෙන්නේ නැති බව (Absent) රියදුරුට දැන්වීය!");
        }

        socket.on('connect', () => {
            socket.emit('join', { vehicle_code: myVehicleCode, username: myUsername, role: 'passenger' });
        });

        socket.on('broadcast_location', (data) => {
            if (!data || data.role !== 'driver') return;

            let dLat = parseFloat(data.lat);
            let dLng = parseFloat(data.lng);
            if (isNaN(dLat) || isNaN(dLng)) return;

            latestDriverCoords = { lat: dLat, lng: dLng };
            let driverLabel = data.username ? `රියදුරු (${data.username})` : "රියදුරු (Driver)";

            if (!driverMarker) {
                driverMarker = L.marker([dLat, dLng], { icon: redIcon })
                    .addTo(map)
                    .bindPopup(driverLabel)
                    .openPopup();
            } else {
                driverMarker.setLatLng([dLat, dLng]);
                driverMarker.setPopupContent(driverLabel);
            }

            if (latestPassengerCoords) {
                checkProximity();
            } else {
                document.getElementById('status').innerText =
                    `රියදුරු සජීවීව සිටී (${dLat.toFixed(4)}, ${dLng.toFixed(4)})`;
            }
        });

        socket.on('remove_user', (data) => {
            if (!data) return;

            if (data.role === 'driver') {
                if (driverMarker) {
                    map.removeLayer(driverMarker);
                    driverMarker = null;
                }
                latestDriverCoords = null;
                autoBandAlarmTriggered = false;
                customKmAlarmTriggered = false;
                clearAlarmUIOnly();
                document.getElementById('distanceInfo').innerText = "📏 වාහනයට: --";
                document.getElementById('etaInfo').innerText = "⏱️ වේලාව: --";
                document.getElementById('status').innerText = "රියදුරු දැන් Offline වී ඇත.";
                return;
            }

            if (data.username && data.username === myUsername) {
                autoBandAlarmTriggered = false;
                customKmAlarmTriggered = false;
                clearAlarmUIOnly();
                document.getElementById('status').innerText =
                    "✅ ඔබගේ ගමන / Alarm එක අවසන් කරන ලදී.";
            }
        });

        function startGPSTracking() {
            if (!("geolocation" in navigator)) {
                document.getElementById('status').innerText = "ඔබගේ බ්‍රව්සරය GPS සඳහා සහාය නොදක්වයි.";
                return;
            }

            navigator.geolocation.watchPosition(
                (position) => {
                    let lat = position.coords.latitude;
                    let lng = position.coords.longitude;
                    latestPassengerCoords = { lat: lat, lng: lng };

                    if (!passengerMarker) {
                        passengerMarker = L.marker([lat, lng], { icon: greenIcon }).addTo(map).bindPopup("ඔබ (මගියා)").openPopup();
                        map.setView([lat, lng], 15);
                    } else {
                        passengerMarker.setLatLng([lat, lng]);
                    }

                    checkHomeProximity();

                    if (latestDriverCoords) {
                        checkProximity();
                    } else {
                        document.getElementById('status').innerText = "ජීපීඑස් ලොකේෂන් යැවෙමින් පවතී (" + lat.toFixed(4) + ", " + lng.toFixed(4) + ")";
                    }

                    socket.emit('update_location', {
                        role: 'passenger',
                        lat: lat,
                        lng: lng,
                        vehicle_code: myVehicleCode,
                        username: myUsername
                    });
                },
                (error) => {
                    document.getElementById('status').innerText = "GPS දෝෂයකි! කරුණාකර Location (GPS) සක්‍රීය කරන්න.";
                },
                { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
            );
        }

        startGPSTracking();
    </script>
