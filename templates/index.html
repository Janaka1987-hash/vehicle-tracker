<!DOCTYPE html>
<html lang="si">
<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Location & Proximity Alarm</title>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; text-align: center; }
        #map { height: 70vh; width: 100%; }
        .controls { padding: 15px; background: #f4f4f4; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>මාර්ගගත මගී ලුහුබැඳීමේ පද්ධතිය (Live Tracking App)</h2>
    <div class="controls">
        <button id="roleBtn" onclick="toggleRole()">මම මගියෙක් (Passenger)</button>
        <p id="status">තත්ත්වය: නවත්වන ලදී</p>
    </div>

    <div id="map"></div>

    <!-- Socket.IO සහ Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const socket = io();
        let map = L.map('map').setView([7.8731, 80.7718], 8); // Sri Lanka default center
        let marker;
        let isPassenger = true;
        let driverLat = 0, driverLng = 0;
        let passengerLat = 0, passengerLng = 0;

        // Leaflet Map Tile එක එක් කිරීම
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        // Alarm ශබ්දය සදාගැනීම (Audio beep using Web Audio API)
        function playAlarm() {
            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let oscillator = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.value = 800; // Frequency of alarm
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            setTimeout(() => { oscillator.stop(); }, 1000); // තත්පර 1ක් ශබ්ද වේ
        }

        function toggleRole() {
            isPassenger = !isPassenger;
            document.getElementById('roleBtn').innerText = isPassenger ? "මම මගියෙක් (Passenger)" : "මම රියදුරෙක් (Driver)";
            alert(isPassenger ? "දැන් ඔබ මගියෙක් ලෙස ක්‍රියා කරයි." : "දැන් ඔබ රියදුරෙක් ලෙස ක්‍රියා කරයි.");
        }

        // GPS ලොකේෂන් ලබාගෙන යැවීම හෝ පරීක්ෂා කිරීම
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(position => {
                let lat = position.coords.latitude;
                let lng = position.coords.longitude;

                if (!marker) {
                    marker = L.marker([lat, lng]).addTo(map).bindPopup("ඔබ සිටින තැන").openPopup();
                } else {
                    marker.setLatLng([lat, lng]);
                }
                map.setView([lat, lng], 15);

                if (isPassenger) {
                    // මගියෙක් නම් තමන්ගේ ලොකේෂන් එක Server එකට යවයි
                    socket.emit('update_passenger_location', { lat: lat, lng: lng });
                    document.getElementById('status').innerText = "ලොකේෂන් එක Share වෙමින් පවතී...";
                } else {
                    driverLat = lat;
                    driverLng = lng;
                }
            }, err => { console.error(err); }, { enableHighAccuracy: true });
        }

        // රියදුරුට මගියාගේ ලොකේෂන් ලැබෙන විට
        socket.on('broadcast_location_to_driver', (data) => {
            if (!isPassenger) {
                passengerLat = data.lat;
                passengerLng = data.lng;

                // රියදුරු සහ මගියා අතර දුර මැනීම (Haversine formula ආසන්න ලෙස)
                let distance = getDistanceFromLatLonInKm(driverLat, driverLng, passengerLat, passengerLng) * 1000; // මීටර් වලින්
                
                document.getElementById('status').innerText = `මගියාට ඇති දුර: ${distance.toFixed(1)} මීටර්`;

                // මීටර් 500කට වඩා අඩු නම් Alarm එක ක්‍රියාත්මක වේ
                if (distance <= 500) {
                    playAlarm();
                    console.log("අවධානයයි! මගියෙකු අසල ළඟා වෙමින් පවතී!");
                }
            }
        });

        // දුර ගණනය කරන ගණිතමය සූත්‍රය (Haversine Formula)
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            let R = 6371; // Radius of the earth in km
            let dLat = deg2rad(lat2-lat1);
            let dLon = deg2rad(lon2-lon1);
            let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; // Distance in km
        }

        function deg2rad(deg) {
            return deg * (Math.PI/180);
        }
    </script>
</body>
</html>
