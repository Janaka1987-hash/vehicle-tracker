<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>රියදුරුගේ පිටුව - Driver Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; text-align: center; }
        header { background: #007bff; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        #map { height: 60vh; width: 100%; }
        .status { padding: 10px; background: #e2e3e5; font-weight: bold; color: #383d41; font-size: 14px; }
        .panel { background: #f8f9fa; padding: 10px; display: flex; justify-content: center; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #ddd; }
        a.logout { color: white; background: #dc3545; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-weight: bold; }
        .badge { padding: 5px 10px; border-radius: 4px; color: white; background: #6c757d; font-size: 13px; margin: 2px; display: inline-block; }
        .btn-alarm { background: #ff9800; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-stop { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; display: none; }
        #alarm-banner { background: #dc3545; color: white; padding: 12px; font-weight: bold; display: none; font-size: 16px; }
    </style>
</head>
<body>
    <header>
        <h3 style="margin:0; font-size: 16px;">{{ username }} (රියදුරු - {{ vehicle_code }})</h3>
        <a href="/logout" class="logout">ඉවත් වන්න</a>
    </header>

    <div id="alarm-banner">🚨 අවධානයයි! මගියෙකු මීටර් 500 ක් ඇතුළත සිටී!</div>

    <div class="panel">
        <button id="enable-alarm-btn" class="btn-alarm" onclick="enableBackgroundAlarm()">🔔 එලාම් සක්‍රීය කරන්න (Enable Alarm)</button>
        <button id="stop-alarm-btn" class="btn-stop" onclick="stopAlarm()">🔕 එලාම් නවත්වන්න (Stop Alarm)</button>
    </div>

    <div class="panel" id="attendance-list">
        <span style="font-weight:bold;">මගීන්ගේ පැමිණීම:</span>
        <span id="no-attendance" class="badge">තවමත් ලැබී නැත</span>
    </div>

    <div class="status" id="status">ඔබේ ජීපීඑස් ලොකේෂන් එක ලබා ගනිමින් පවතී...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
    
    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        let map = L.map('map').setView([7.8731, 80.7718], 13);
        let driverMarker = null;
        let driverCoords = null;
        let passengerMarkers = {}; // සියලුම මගීන්ගේ මාර්කර්ස්
        let passengerLines = {};   // සියලුම මගීන් වෙත ඇඳෙන රේඛා
        let alertedPassengers = {}; // දැනටමත් ඇලර්ට් කළ මගීන්
        let myVehicleCode = "{{ vehicle_code }}".trim();
        let alarmInterval = null;
        let audioCtx = null;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        const greenIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41]
        });

        // Call එකකදී / Lock Screen එකේදී පවා වැඩ කිරීමට Notification & Audio සක්‍රීය කිරීම
        async function enableBackgroundAlarm() {
            if ("Notification" in window) {
                await Notification.requestPermission();
            }
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); } catch (e) {}
            }
            document.getElementById('enable-alarm-btn').innerText = "✅ එලාම් සක්‍රීයයි";
            document.getElementById('enable-alarm-btn').style.background = "#28a745";
            alert("එලාම් සහ නොටිෆිකේෂන් සක්‍රීය විය! ඔබ Call එකක සිටියත් හෝ වෙනත් ඇප් එකක සිටියත් මගියෙකු ළඟට ආ විට දැනුම් දෙනු ඇත.");
        }

        function triggerAlarm(passengerName, distance) {
            document.getElementById('alarm-banner').innerText = `🚨 මගී ${passengerName} ඔබ අසලින්ම (මීටර් ${Math.round(distance)}) සිටී!`;
            document.getElementById('alarm-banner').style.display = "block";
            document.getElementById('stop-alarm-btn').style.display = "inline-block";

            // 1. දිගටම ෆෝන් එක Vibrate කිරීම (Call එකකදී දැනීමට)
            if ("vibrate" in navigator) {
                navigator.vibrate([1000, 400, 1000, 400, 1000]);
            }

            // 2. System Notification (Lock Screen / Call Screen මත පෙන්වීමට)
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("🚨 මගියා අසලයි!", {
                    body: `මගී ${passengerName} මීටර් ${Math.round(distance)} ක් ඉදිරියෙන් සිටී.`,
                    requireInteraction: true,
                    vibrate: [1000, 400, 1000]
                });
            }

            // 3. අඛණ්ඩ සයිරන් හඬ (Web Audio API)
            if (!alarmInterval) {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                alarmInterval = setInterval(() => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                    if ("vibrate" in navigator) navigator.vibrate([600, 200]);
                }, 1000);
            }
        }

        function stopAlarm() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
            document.getElementById('alarm-banner').style.display = "none";
            document.getElementById('stop-alarm-btn').style.display = "none";
            if ("vibrate" in navigator) navigator.vibrate(0);
        }

        // මීටර් වලින් දුර මැනීම (Haversine Formula)
        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const p1 = lat1 * Math.PI / 180;
            const p2 = lat2 * Math.PI / 180;
            const dp = (lat2 - lat1) * Math.PI / 180;
            const dl = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        socket.on('connect', () => {
            socket.emit('join', { vehicle_code: myVehicleCode });
        });

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                let lat = position.coords.latitude;
                let lng = position.coords.longitude;
                driverCoords = [lat, lng];

                if (!driverMarker) {
                    driverMarker = L.marker([lat, lng]).addTo(map).bindPopup("ඔබ (රියදුරු)").openPopup();
                    map.setView([lat, lng], 15);
                } else {
                    driverMarker.setLatLng([lat, lng]);
                }

                document.getElementById('status').innerText = "සජීවී ලොකේෂන් යැවෙමින් පවතී (" + lat.toFixed(4) + ", " + lng.toFixed(4) + ")";

                socket.emit('update_location', {
                    role: 'driver',
                    lat: lat,
                    lng: lng,
                    vehicle_code: myVehicleCode,
                    username: "{{ username }}"
                });

                checkAllDistances();
            }, (error) => {
                document.getElementById('status').innerText = "GPS දෝෂයකි! කරුණාකර ලොකේෂන් පර්මිෂන් ලබා දෙන්න.";
            }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
        }

        function checkAllDistances() {
            if (!driverCoords) return;
            for (let pUser in passengerMarkers) {
                let pLatLng = passengerMarkers[pUser].getLatLng();
                let dist = getDistanceMeters(driverCoords[0], driverCoords[1], pLatLng.lat, pLatLng.lng);

                // රියදුරු සහ මගියා අතර රේඛාව යාවත්කාලීන කිරීම
                if (passengerLines[pUser]) {
                    passengerLines[pUser].setLatLngs([driverCoords, [pLatLng.lat, pLatLng.lng]]);
                } else {
                    passengerLines[pUser] = L.polyline([driverCoords, [pLatLng.lat, pLatLng.lng]], { color: '#007bff', weight: 4, dashArray: '8, 8' }).addTo(map);
                }

                // මීටර් 500 කට අඩු නම් එලාම් එක නාද කිරීම
                if (dist <= 500 && !alertedPassengers[pUser]) {
                    alertedPassengers[pUser] = true;
                    triggerAlarm(pUser, dist);
                } else if (dist > 600) {
                    alertedPassengers[pUser] = false;
                }
            }
        }

        // සියලුම මගීන්ගේ ලොකේෂන් වෙන වෙනම සිතියමේ පෙන්වීම
        socket.on('broadcast_location', (data) => {
            if (data.role === 'passenger' && data.lat && data.lng) {
                let pUser = data.username;
                let pLat = parseFloat(data.lat);
                let pLng = parseFloat(data.lng);

                if (!passengerMarkers[pUser]) {
                    passengerMarkers[pUser] = L.marker([pLat, pLng], { icon: greenIcon }).addTo(map).bindPopup("මගියා: " + pUser).openPopup();
                } else {
                    passengerMarkers[pUser].setLatLng([pLat, pLng]);
                }
                checkAllDistances();
            }
        });

        // සියලුම මගීන්ගේ පැමිණීම වෙන වෙනම පෙන්වීම
        socket.on('broadcast_attendance', (data) => {
            let noAtt = document.getElementById('no-attendance');
            if (noAtt) noAtt.style.display = 'none';

            let badgeId = 'att-' + data.username;
            let badge = document.getElementById(badgeId);
            if (!badge) {
                badge = document.createElement('span');
                badge.id = badgeId;
                badge.className = 'badge';
                document.getElementById('attendance-list').appendChild(badge);
            }
            badge.innerText = data.username + ": " + (data.status === 'Present' ? 'එනවා' : 'එන්නේ නැහැ');
            badge.style.background = data.status === 'Present' ? '#28a745' : '#dc3545';
        });
    </script>
</body>
</html>
