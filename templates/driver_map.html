<!DOCTYPE html>
<html lang="si">
<head>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>රියදුරුගේ පිටුව - Driver Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; text-align: center; background: #f4f6f9; }
        header { background: #007bff; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        #map { height: 62vh; width: 100%; transition: height 0.3s ease; }
        .status { padding: 8px; background: #e2e3e5; font-weight: bold; color: #383d41; font-size: 13px; }
        .panel { background: #ffffff; padding: 10px; display: flex; justify-content: center; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #ddd; }
        a.logout { color: white; background: #dc3545; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn-alarm { background: #ff9800; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-stop { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; display: none; }
        .btn-toggle-list { background: #17a2b8; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #alarm-banner { background: #dc3545; color: white; padding: 12px; font-weight: bold; display: none; font-size: 16px; }
        
        .passenger-box { background: white; margin: 8px 10px; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: left; }
        .passenger-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 5px; }
        .passenger-header h4 { margin: 0; color: #007bff; font-size: 15px; }
        .table-scroll-container { max-height: 140px; overflow-y: auto; border: 1px solid #f0f0f0; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 7px 8px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f8f9fa; color: #333; position: sticky; top: 0; z-index: 1; }
        .badge-online { background: #28a745; color: white; padding: 2px 6px; border-radius: 10px; font-size: 11px; }
        .badge-present { background: #28a745; color: white; padding: 3px 7px; border-radius: 4px; font-size: 11px; }
        .badge-absent { background: #dc3545; color: white; padding: 3px 7px; border-radius: 4px; font-size: 11px; }
        .badge-pending { background: #6c757d; color: white; padding: 3px 7px; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>
    <header>
        <h3 style="margin:0; font-size: 16px;">{{ username }} (රියදුරු - {{ vehicle_code }})</h3>
        <a href="/logout" class="logout" onclick="notifyLogout()">ඉවත් වන්න</a>
    </header>

    <div id="alarm-banner">🚨 අවධානයයි! මගියෙකු මීටර් 500 ක් ඇතුළත සිටී!</div>

    <div class="panel">
        <button id="enable-alarm-btn" class="btn-alarm" onclick="enableBackgroundAlarm()">🔔 එලාම් සක්‍රීය කරන්න</button>
        <button id="stop-alarm-btn" class="btn-stop" onclick="stopAlarmAndRemovePassenger()">🔕 එලාම් නවත්වන්න & මගියා ඉවත් කරන්න</button>
        <button id="toggle-list-btn" class="btn-toggle-list" onclick="togglePassengerList()">📋 ලැයිස්තුව සඟවන්න</button>
    </div>

    <div class="passenger-box" id="passenger-list-container">
        <div class="passenger-header">
            <h4>👥 සම්බන්ධ වී සිටින මගීන් (<span id="passenger-count">0</span>)</h4>
        </div>
        <div class="table-scroll-container">
            <table>
                <thead>
                    <tr>
                        <th>මගියාගේ නම</th>
                        <th>දුර</th>
                        <th>පැමිණීම</th>
                    </tr>
                </thead>
                <tbody id="passenger-table-body">
                    <tr id="empty-row">
                        <td colspan="3" style="text-align:center; color:#777;">තවමත් මගීන් ලොග් වී නැත...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="status" id="status">ඔබේ ජීපීඑස් ලොකේෂන් එක ලබා ගනිමින් පවතී...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
    
    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        let map = L.map('map').setView([7.8731, 80.7718], 13);
        let driverMarker = null;
        let driverCoords = null;
        let passengerMarkers = {};
        let passengerAttendance = {};
        let alertedPassengers = {};
        let myVehicleCode = "{{ vehicle_code }}".trim();
        let alarmInterval = null;
        let audioCtx = null;
        let isListVisible = true;
        let currentActivePassenger = null;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        const greenIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41]
        });

        function getAllKnownPassengers() {
            const names = new Set([
                ...Object.keys(passengerMarkers),
                ...Object.keys(passengerAttendance)
            ]);
            return Array.from(names);
        }

        function togglePassengerList() {
            const container = document.getElementById('passenger-list-container');
            const btn = document.getElementById('toggle-list-btn');
            const mapDiv = document.getElementById('map');

            if (isListVisible) {
                container.style.display = 'none';
                btn.innerText = '📋 ලැයිස්තුව පෙන්වන්න';
                mapDiv.style.height = '78vh';
            } else {
                container.style.display = 'block';
                btn.innerText = '📋 ලැයිස්තුව සඟවන්න';
                mapDiv.style.height = '62vh';
            }
            isListVisible = !isListVisible;
            setTimeout(() => { map.invalidateSize(); }, 350);
        }

        function notifyLogout() {
            socket.emit('user_logout', { username: "{{ username }}", role: 'driver', vehicle_code: myVehicleCode });
        }

        async function enableBackgroundAlarm() {
            if ("Notification" in window) {
                await Notification.requestPermission();
            }
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); } catch (e) {}
            }
            document.getElementById('enable-alarm-btn').innerText = "✅ එලාම් සක්‍රීයයි";
            document.getElementById('enable-alarm-btn').style.background = "#28a745";
            alert("එලාම් සහ නොටිෆිකේෂන් සක්‍රීය විය!");
        }

        function triggerAlarm(passengerName, distance) {
            currentActivePassenger = passengerName;
            document.getElementById('alarm-banner').innerText = `🚨 මගී ${passengerName} ඔබ අසලින්ම (මීටර් ${Math.round(distance)}) සිටී!`;
            document.getElementById('alarm-banner').style.display = "block";
            document.getElementById('stop-alarm-btn').style.display = "inline-block";

            if ("vibrate" in navigator) {
                navigator.vibrate([1000, 400, 1000, 400, 1000]);
            }

            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("🚨 මගියා අසලයි!", {
                    body: `මගී ${passengerName} මීටර් ${Math.round(distance)} ක් ඉදිරියෙන් සිටී.`,
                    requireInteraction: true,
                    vibrate: [1000, 400, 1000]
                });
            }

            if (!alarmInterval) {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                alarmInterval = setInterval(() => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                    if ("vibrate" in navigator) navigator.vibrate([600, 200]);
                }, 1000);
            }
        }

        function stopAlarm() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
            document.getElementById('alarm-banner').style.display = "none";
            document.getElementById('stop-alarm-btn').style.display = "none";
            if ("vibrate" in navigator) navigator.vibrate(0);
        }

        function removePassengerFromUI(pUser) {
            if (!pUser) return;
            if (passengerMarkers[pUser]) {
                map.removeLayer(passengerMarkers[pUser]);
                delete passengerMarkers[pUser];
            }
            delete alertedPassengers[pUser];
            delete passengerAttendance[pUser];

            let row = document.getElementById('row-' + pUser);
            if (row) row.remove();

            if (currentActivePassenger === pUser) {
                currentActivePassenger = null;
                stopAlarm();
            }

            updatePassengerListAndDistances();
        }

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const p1 = lat1 * Math.PI / 180;
            const p2 = lat2 * Math.PI / 180;
            const dp = (lat2 - lat1) * Math.PI / 180;
            const dl = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        socket.on('connect', () => {
            socket.emit('join', { vehicle_code: myVehicleCode, username: "{{ username }}", role: 'driver' });
        });

        function startGPSTracking() {
            if (!("geolocation" in navigator)) {
                document.getElementById('status').innerText = "ඔබගේ බ්‍රව්සරය GPS සඳහා සහාය නොදක්වයි.";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => { handlePositionSuccess(pos); },
                (err) => { console.warn("Initial GPS fallback:", err.message); },
                { enableHighAccuracy: false, timeout: 8000, maximumAge: 30000 }
            );

            navigator.geolocation.watchPosition(
                handlePositionSuccess,
                (error) => {
                    document.getElementById('status').innerText = "GPS දෝෂයකි! කරුණාකර Location (GPS) සක්‍රීය කරන්න.";
                },
                { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
            );
        }

        function handlePositionSuccess(position) {
            let lat = position.coords.latitude;
            let lng = position.coords.longitude;
            driverCoords = [lat, lng];

            if (!driverMarker) {
                driverMarker = L.marker([lat, lng]).addTo(map).bindPopup("ඔබ (රියදුරු)").openPopup();
                map.setView([lat, lng], 15);
            } else {
                driverMarker.setLatLng([lat, lng]);
            }

            document.getElementById('status').innerText = "සජීවී ලොකේෂන් යැවෙමින් පවතී (" + lat.toFixed(4) + ", " + lng.toFixed(4) + ")";

            socket.emit('update_location', {
                role: 'driver',
                lat: lat,
                lng: lng,
                vehicle_code: myVehicleCode,
                username: "{{ username }}"
            });

            updatePassengerListAndDistances();
        }

        startGPSTracking();

        function updatePassengerListAndDistances() {
            let tbody = document.getElementById('passenger-table-body');
            let pNames = getAllKnownPassengers();
            document.getElementById('passenger-count').innerText = pNames.length;

            if (pNames.length === 0) {
                tbody.innerHTML = `<tr id="empty-row"><td colspan="3" style="text-align:center; color:#777;">තවමත් මගීන් ලොග් වී නැත...</td></tr>`;
                return;
            }

            let emptyRow = document.getElementById('empty-row');
            if (emptyRow) emptyRow.remove();

            Array.from(tbody.querySelectorAll('tr[id^="row-"]')).forEach(tr => {
                const nameFromRow = tr.id.replace(/^row-/, '');
                if (!pNames.includes(nameFromRow)) {
                    tr.remove();
                }
            });

            pNames.forEach(pUser => {
                let distText = "GPS බලාපොරොත්තුවෙන්...";

                if (passengerMarkers[pUser]) {
                    let pLatLng = passengerMarkers[pUser].getLatLng();
                    distText = "ගණනය වෙමින්...";

                    if (driverCoords) {
                        let dist = getDistanceMeters(driverCoords[0], driverCoords[1], pLatLng.lat, pLatLng.lng);
                        distText = dist >= 1000 ? (dist / 1000).toFixed(2) + " km" : Math.round(dist) + " m";

                        if (dist <= 500 && !alertedPassengers[pUser]) {
                            alertedPassengers[pUser] = true;
                            triggerAlarm(pUser, dist);
                        } else if (dist > 600) {
                            alertedPassengers[pUser] = false;
                        }
                    }
                }

                let attStatus = passengerAttendance[pUser] || 'Pending';
                let attBadge = `<span class="badge-pending">තීරණය කර නැත</span>`;
                if (attStatus === 'Present') attBadge = `<span class="badge-present">🟢 එනවා</span>`;
                if (attStatus === 'Absent') attBadge = `<span class="badge-absent">🔴 එන්නේ නැහැ</span>`;

                let rowId = 'row-' + pUser;
                let row = document.getElementById(rowId);
                if (!row) {
                    row = document.createElement('tr');
                    row.id = rowId;
                    tbody.appendChild(row);
                }
                row.innerHTML = `
                    <td><strong>${pUser}</strong> <span class="badge-online">Online</span></td>
                    <td><strong>${distText}</strong></td>
                    <td>${attBadge}</td>
                `;
            });
        }

        socket.on('broadcast_location', (data) => {
            if (data && data.role === 'passenger' && data.lat && data.lng) {
                let pUser = (data.username || '').trim();
                if (!pUser) return;
                let pLat = parseFloat(data.lat);
                let pLng = parseFloat(data.lng);
                if (isNaN(pLat) || isNaN(pLng)) return;

                if (!passengerMarkers[pUser]) {
                    passengerMarkers[pUser] = L.marker([pLat, pLng], { icon: greenIcon }).addTo(map).bindPopup("මගියා: " + pUser);
                } else {
                    passengerMarkers[pUser].setLatLng([pLat, pLng]);
                }
                updatePassengerListAndDistances();
            }
        });

        socket.on('broadcast_attendance', (data) => {
            if (!data || !data.username) return;
            const pUser = String(data.username).trim();
            if (!pUser) return;
            passengerAttendance[pUser] = data.status;
            updatePassengerListAndDistances();
        });

        socket.on('remove_user', (data) => {
            if (!data || !data.username) return;
            if (data.role === 'driver') return;
            removePassengerFromUI(String(data.username).trim());
        });

        function stopAlarmAndRemovePassenger() {
            let targetPassenger = currentActivePassenger;
            stopAlarm();
            if (targetPassenger) {
                socket.emit('complete_passenger_trip', { 
                    passenger_name: targetPassenger, 
                    vehicle_code: myVehicleCode 
                });
                removePassengerFromUI(targetPassenger);
                currentActivePassenger = null;
            }
        }
    </script>
</body>
</html>
