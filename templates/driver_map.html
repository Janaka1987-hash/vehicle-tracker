<script>
    const socket = io({ transports: ['websocket', 'polling'] });
    let map = L.map('map').setView([7.8731, 80.7718], 13);
    let myMarker;
    let myVehicleCode = "{{ vehicle_code }}";

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    socket.on('connect', () => {
        console.log("Connected to server, joining room:", myVehicleCode);
        socket.emit('join', { vehicle_code: myVehicleCode });
    });

    // ජීපීඑස් ලොකේෂන් එක නිරන්තරයෙන් ලබාගෙන සර්වර් එකට යැවීම
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition((position) => {
            let lat = position.coords.latitude;
            let lng = position.coords.longitude;

            if (!myMarker) {
                myMarker = L.marker([lat, lng]).addTo(map).bindPopup("ඔබ (රියදුරු)").openPopup();
            } else {
                myMarker.setLatLng([lat, lng]);
            }
            map.setView([lat, lng], 16);
            document.getElementById('status').innerText = "සජීවී ලොකේෂන් යැවෙමින් පවතී: Lat: " + lat.toFixed(4) + ", Lng: " + lng.toFixed(4);

            // සර්වර් එක හරහා මගියාට ලොකේෂන් එක යැවීම
            socket.emit('update_location', {
                lat: lat,
                lng: lng,
                vehicle_code: myVehicleCode,
                username: "{{ username }}"
            });
        }, (error) => {
            console.log("GPS Error: ", error);
            // ජීපීඑස් ලොකේෂන් එක ලබාගැනීමේදී යම් බාධාවක් වුවහොත් කොළඹ ප්‍රදේශයේ ඩිෆෝල්ට් ලොකේෂන් එකක් යැවීම (ටෙස්ට් කිරීම පහසු වීමට)
            let defaultLat = 6.9271;
            let defaultLng = 79.8612;
            
            socket.emit('update_location', {
                lat: defaultLat,
                lng: defaultLng,
                vehicle_code: myVehicleCode,
                username: "{{ username }}"
            });
            document.getElementById('status').innerText = "GPS සංඥා දුර්වලයි - ඩිෆෝල්ට් ලොකේෂන් එක යැවේ.";
        }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    } else {
        document.getElementById('status').innerText = "ඔබේ බ්‍රවුසරය Geolocation සඳහා සහය නොදක්වයි.";
    }

    // මගියාගේ පැමිණීමේ තත්ත්වය රියදුරුට පෙන්වීම
    socket.on('broadcast_attendance', (data) => {
        let badge = document.getElementById('attendance-status');
        if `badge` {
            badge.innerText = data.username + " - " + data.status;
            badge.style.background = data.status === 'Present' ? '#28a745' : '#dc3545';
        }
    });
</script>
